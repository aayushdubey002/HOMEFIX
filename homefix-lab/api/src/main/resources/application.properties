spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

server.port=${PORT:8083}
server.address=0.0.0.0

# Database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:homefix}?sslMode=${DB_SSL_MODE:PREFERRED}&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:homefix_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# File uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Security
app.security.jwt-secret=${JWT_SECRET:dev-homefix-local-jwt-secret-32bytes-min}
app.security.pin-encryption-key=${BOOKING_PIN_ENCRYPTION_KEY:${JWT_SECRET:dev-homefix-local-jwt-secret-32bytes-min}}

# Location
app.location.service-radius-km=${SERVICE_RADIUS_KM:25}
app.location.simulation-enabled=${LOCATION_SIMULATION_ENABLED:false}

# Admin
app.admin.bootstrap-email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}

# Frontend
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# Storage
app.provider-documents.directory=${PROVIDER_DOCUMENTS_DIRECTORY:var/homefix-documents/provider-verification}
app.service-category-images.directory=${SERVICE_CATEGORY_IMAGES_DIRECTORY:var/homefix-images/service-categories}

# Razorpay
app.payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}